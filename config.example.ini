[general]
; print progress/diagnostic messages (sync transitions, drive polling,
; export steps, ...) to stdout. Turn off for quiet cron runs where you only
; care about the log file / email digest.
verbose = true

[pbs]
host = pbs.example.com
port = 8007
user = tape-admin@pbs
; token_id is just the token's own name (the part after '!' in its full id
; tape-admin@pbs!tape-reader), NOT the full "user!token" string -- 'user'
; above already provides the user part. See README "Setup" for the exact
; commands used to create this user/token.
token_id = tape-reader
token_secret = REPLACE-WITH-TOKEN-SECRET
verify_ssl = true
; request timeout (seconds) applied to every PBS API call (changer status,
; transfer, load/unload, etc.) -- some tape operations legitimately take a
; while, so this is enforced to be at least 60 regardless of what's set here.
api_timeout_seconds = 60

; identifiers as configured in PBS (Tape Backup -> Changers / Drives)
changer = changer0
drive = drive0

; after issuing a load command, how many times to poll drive status
; (waiting drive_ready_delay_seconds between each) before giving up.
; default: 20 x 5s = up to 100s
drive_ready_attempts = 20
drive_ready_delay_seconds = 5

; the 6 import/export ("mailslot") slot numbers on your library,
; as shown in `proxmox-tape changer status` / the GUI
export_slots = 25,26,27,28,29,30

[policy]
; Which pool(s) get tapes auto-flagged for export once PBS marks them 'full'.
; Three forms:
;   All              -> every pool (case-insensitive)
;   pool1,pool2,...  -> only these pools (e.g. a GFS scheme's daily/weekly/
;                        monthly/yearly pools -- list as many as apply)
;   <empty>          -> auto-flagging disabled; export only via `mark-export`
auto_export_pools = offsite-monthly,offsite-yearly

; A tape's actual return date is really governed by its own pool's
; retention policy in PBS (each pool can have a different retention --
; this is what makes GFS schemes with several pools work correctly here,
; since 'expired' is checked per-tape/per-pool, not globally).
;
; return_after_days is an optional HARD CAP on top of that: if set above 0,
; a tape gets nagged about once it has been external this many days,
; *regardless* of whether its pool considers it expired yet -- a safety net
; for pools with very long or no configured retention. Set to 0 to disable
; the cap and rely purely on each pool's own expiration.
return_after_days = 0

; if the drive's TapeAlertFlags indicate a cleaning cycle is needed
; ("Clean Now" / "Clean Periodic"), run one automatically once the tape
; currently being exported has been unloaded. If false, we only log/email
; a warning and leave cleaning to the operator.
auto_clean_drive = false

; medium-wearout (from drive status) is reported as a percentage.
; warn between wearout_warn_pct and wearout_error_pct, error above that.
wearout_warn_pct = 80
wearout_error_pct = 100

; the events table is an audit log (exports, arrivals, alerts, errors, ...);
; rows older than this many days are purged automatically on every 'run'
; (and via the standalone 'cleanup-events' command) so the database doesn't
; grow unbounded.
event_retention_days = 365

[email]
enabled = true
smtp_host = smtp.example.com
smtp_port = 587
smtp_starttls = true
smtp_user = notifications@example.com
smtp_password = REPLACE-WITH-SMTP-PASSWORD
from_addr = tape-admin@example.com
to_addr = operator@example.com
